<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // pick the theme before first paint so the page doesn't flash
      try {
        var t = localStorage.getItem("memops-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MemOps — Ops memory that learns from every incident</title>
    <meta
      name="description"
      content="MemOps uses Cognee's graph memory to recall past incidents, suggest fixes, and learn from every resolution — so institutional knowledge never walks out the door."
    />
    <!-- Open Graph / social unfurl -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MemOps — Ops memory that learns from every incident" />
    <meta
      property="og:description"
      content="MemOps uses Cognee's graph memory to recall past incidents, suggest fixes, and learn from every resolution — so institutional knowledge never walks out the door."
    />
    <meta property="og:url" content="https://mem-ops.vercel.app" />
    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MemOps — Ops memory that learns from every incident" />
    <meta
      name="twitter:description"
      content="MemOps uses Cognee's graph memory to recall past incidents, suggest fixes, and learn from every resolution."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
