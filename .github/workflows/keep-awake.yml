# Keeps the Hugging Face Space backend awake. A free Space sleeps after 48 hours
# with no visitors, and waking it means reseeding all 17 incidents (~11 minutes),
# so a request every 12 hours keeps the demo ready.
name: Keep backend awake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the backend health check
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors \
            --max-time 120 https://beyanki-memops-api.hf.space/api/health
          echo
          curl --silent --max-time 30 https://beyanki-memops-api.hf.space/api/seed-status
          echo

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling this workflow on every run resets that timer.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-awake.yml/enable"
